<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Profile</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #fffdd0;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: start;
        height: 100vh;
      }
      .container {
        width: 90%;
        max-width: 400px;
        background-color: #fffdd0;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
      }
      .header {
        display: flex;
        margin-bottom: 20px;
      }

      .header a {
        position: fixed;
        left: 5%;
      }

      .header h2 {
        position: fixed;
        left: 0;
        right: 0;
        margin: 0;
        font-size: 1.5rem;
        font-weight: bold;
      }

      .profile-pic-container {
        margin: 20% auto;
        text-align: center;
      }

      .profile-pic-label {
        display: block;
        width: 120px;
        height: 120px;
        margin: 0 auto;
        background-color: #fff;
        border: 2px solid #ddd;
        border-radius: 50%;
        cursor: pointer;
        position: relative;
        overflow: hidden;
      }

      .profile-pic-label img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: none;
      }

      .profile-pic-label::after {
        content: "Profile";
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 14px;
        color: #888;
        text-align: center;
        pointer-events: none;
      }

      input[type="file"] {
        display: none;
      }

      .input-container {
        margin: 20px 0;
      }

      .input-field-container {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        background-color: #fff;
        border: 2px solid #ddd;
        border-radius: 5px;
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
      }

      .input-field-container .input-label {
        font-size: 1rem;
        font-weight: bold;
        color: #333;
        margin-bottom: 5px;
      }

      .input-field-container .input-field {
        width: 100%;
        padding: 8px;
        font-size: 1rem;
        border: none;
        outline: none;
        background: transparent;
      }

      .button-container {
        display: flex;
        justify-content: space-between;
        margin-top: 10%;
      }

      .button {
        width: 45%;
        padding: 10px;
        font-size: 1rem;
        font-weight: bold;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .button-cancel {
        background-color: #f44336;
        color: #fff;
      }

      .button-cancel:hover {
        background-color: #d32f2f;
      }

      .button-save {
        background-color: #4caf50;
        color: #fff;
      }

      .button-save:hover {
        background-color: #388e3c;
      }
    </style>
    <script src="https://unpkg.com/feather-icons"></script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <a href="homepage.html" id="arrowsett" class="arrow">
          <i data-feather="arrow-left"></i>
        </a>
        <h2>Edit Profile</h2>
      </div>

      <!-- Foto Profil -->
      <div class="profile-pic-container">
        <label for="profile-pic" class="profile-pic-label">
          <img id="preview" src="" alt="Profile Picture" />
        </label>
        <input type="file" id="profile-pic" accept="image/*" />
      </div>

      <!-- Input Username -->
      <div class="input-container">
        <div class="input-field-container">
          <label for="username" class="input-label">Username</label>
          <input
            type="text"
            id="username"
            class="input-field"
            placeholder="Input username"
          />
        </div>
      </div>

      <!-- Input Email -->
      <div class="input-container">
        <div class="input-field-container">
          <label for="email" class="input-label">Email</label>
          <input
            type="email"
            id="email"
            class="input-field"
            placeholder="Input email"
          />
        </div>
      </div>

      <!-- Button -->
      <div class="button-container">
        <button class="button button-cancel">Cancel</button>
        <button class="button button-save">Save</button>
      </div>
    </div>

    <script>
      feather.replace();

      // Script untuk pratinjau gambar
      const fileInput = document.getElementById("profile-pic");
      const preview = document.getElementById("preview");

      fileInput.addEventListener("change", (event) => {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            preview.src = e.target.result;
            preview.style.display = "block";
          };
          reader.readAsDataURL(file);
        }
      });
    </script>
  </body>
</html>
