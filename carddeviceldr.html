<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"></link>
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white rounded-lg shadow-md p-6 w-64">
        <div class="flex items-center justify-between mb-4">
            <!-- Gunakan div untuk memusatkan teks -->
            <div class="flex-1 text-center">
                <span class="text-gray-700 font-medium">LDR</span>
            </div>
            <!-- Ikon edit tetap di sebelah kanan -->
            <i class="fas fa-edit text-gray-500"></i>
        </div>
        <hr class="border-t border-gray-300 mb-4">
        <div class="flex justify-between items-center mb-2">
            <span class="text-gray-700">Pencahayaan</span>
            <span class="text-brown-700 font-semibold">Cukup</span>
        </div>
        <div class="flex justify-between items-center">
            <span class="text-gray-700">Lampu</span>
            <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                <input type="checkbox" name="toggle" id="toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                <label for="toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-green-400 cursor-pointer"></label>
            </div>
        </div>
    </div>
    <style>
        .toggle-checkbox:checked {
            right: 0;
            border-color: #68D391;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #68D391;
        }
    </style>
</body>
</html>
