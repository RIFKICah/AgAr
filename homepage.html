<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgAr</title>

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Icon -->
    <script src="https://unpkg.com/feather-icons"></script>
  </head>
  <body>
    <!-- Main Content -->
    <div id="main-content">
      <nav class="navbar">
        <!-- Logo and setting -->
        <a href="homesementara.html" class="navbar-logo">
          <img src="logo.png" alt="Logo" class="navbar-image" />
        </a>
        <div class="navbar-nav">
          <a href="settings.html" id="setting"
            ><i data-feather="settings"></i
          ></a>
        </div>
      </nav>

      <!-- Hero Section -->
      <section class="hero" id="home">
        <main class="content">
          <div class="card">
            <div class="card-lokasi">
              <a href="#lokasi" id="lokasi">
                <i data-feather="map-pin"></i>
                <span class="card-namalokasi">Sumbersari Jember</span>
              </a>
            </div>

            <div class="card-content">
              <div class="weather-info">
                <img src="logo.png" alt="Weather Logo" class="weather-logo" />
                <!-- Ganti dengan logo cuaca yang sesuai -->
                <div class="humidity" id="humidity">
                  Humidity: <span>60%</span>
                </div>
                <div class="temperature" id="temperature">
                  Temperature: <span>22°C</span>
                </div>
              </div>
            </div>
          </div>

          <div id="data-container">
            <!-- Data content goes here -->
          </div>

          <!-- Placeholder for "no data" message -->
          <div id="no-data" style="display: none">
            <i data-feather="cpu" class="no-data-icon"></i>
            <p>No Devices Added</p>
          </div>

          <button class="round-button">
            <a href="addiot.html"><i data-feather="plus"></i></a>
          </button>
        </main>
      </section>
    </div>

    <!-- Feather Icons Replacement -->
    <script>
      feather.replace();
    </script>

    <!-- Loading Page Script -->
    <script src="script.js"></script>
  </body>
</html>
